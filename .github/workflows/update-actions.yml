# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".

name: update-actions
on:
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        id: install_dependencies
        run: npm ci
      - name: Pin GitHub Actions
        id: pin_github_actions
        run: npx tsx src/security/update-github-actions.ts src .projen .projenrc.ts
      - name: Regenerate project
        id: regenerate_project
        run: npx projen
      - name: Create patch
        id: diff
        run: git diff --patch --exit-code > .repo.patch || echo "patch_created=true" >> $GITHUB_OUTPUT
      - name: Upload patch
        id: upload_patch
        if: steps.diff.outputs.patch_created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: repo.patch
          path: .repo.patch
  pr:
    needs: upgrade
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
      - name: Download patch
        id: download_patch
        uses: actions/download-artifact@v8
        with:
          name: repo.patch
      - name: Apply patch
        id: apply_patch
        run: '[ -f .repo.patch ] && git apply .repo.patch || echo "No patch to apply"'
      - name: Create Pull Request
        id: create_pull_request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PROJEN_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: pin GitHub Actions to latest release SHAs"
          branch: auto/pin-github-actions
          title: "chore: pin GitHub Actions to latest release SHAs"
          body: Automated update of pinned GitHub Action references to their latest stable release commit SHAs.
